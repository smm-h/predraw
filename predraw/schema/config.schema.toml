# strictspec schema — predraw Config (JSON documents).
# predraw's authoritative config schema; generated validator produced via `strictspec gen`.
# Documents must carry a top-level integer `format_version = 1` (the strictspec version gate);
# existing config files are stamped once via scripts/stamp_format_version.py.

name = "PredrawConfig"
meta_version = 1
format_version = 1
document_syntax = "json"
role = "schema"
root = "PredrawConfig"
description = "Configuration file for predraw output settings."

[types.PredrawConfig]
type = "record"

[types.PredrawConfig.fields.outputs]
type = "array"
required = true
min_len = 1
description = "List of output render targets."
[types.PredrawConfig.fields.outputs.item]
type = "Output"

[types.Output]
type = "record"
description = "A single output render target: format, path, and rendering options."
[types.Output.fields.format]
type = "enum"
required = true
values = ["svg", "png", "webp"]
[types.Output.fields.path]
type = "string"
required = true
description = "Output file path (relative to the project directory)."
[types.Output.fields.mode]
type = "enum"
required = false
values = ["light", "dark"]
[types.Output.fields.quality]
type = "integer"
required = false
min = 1
max = 100
description = "Compression quality (lossy formats like webp)."
