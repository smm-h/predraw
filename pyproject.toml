[project]
name = "predraw"
version = "0.4.2"
keywords = ["svg", "render", "json", "declarative", "png", "webp", "pipeline", "text-to-paths", "rlsbl"]
description = "Declarative rendering pipeline that turns JSON scene files into SVG, PNG, and WebP, with light/dark style tokens, reusable components, and text converted to path outlines"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "cairosvg>=2.7",
    "fonttools>=4.62.1",
    "pillow>=10.0",
    # Floor, not a pin. The 0.41 line makes presence a mandatory declaration on
    # every flag and arg, deletes the arg `required=` field, bans a value
    # default on a mutating command, and requires every `choices=` entry to be
    # a record. cli.py is written against all four, and an older strictcli has
    # no `presence=` keyword at all.
    "strictcli>=0.41.1",
    "strictspec>=0.2.1",
]

[project.urls]
Homepage = "https://smmh.dev/predraw/"
Documentation = "https://smmh.dev/predraw/"
Repository = "https://github.com/smm-h/predraw"
Issues = "https://github.com/smm-h/predraw/issues"
Changelog = "https://github.com/smm-h/predraw/blob/main/CHANGELOG.md"

[project.scripts]
predraw = "predraw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "stricttest>=0.1.1",
]

# The stricttest floor. Installing the plugin IS adoption -- it registers via the
# pytest11 entry point and aborts at configure time unless every required stance
# below is declared. predraw's suite is pure in-process rendering: no network, no
# unix sockets, and no sandbox runner exists in this repo yet.
[tool.pytest.ini_options]
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
stricttest_sandbox_required = "false"
